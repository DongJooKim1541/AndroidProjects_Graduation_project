apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

// 문제·프로필 이미지를 Firebase Storage 대신 다른 HTTP 호스트에서 받고 싶을 때 쓴다.
// 무료(Spark) 요금제에서는 Cloud Storage 접근이 HTTP 402 로 막히기 때문이다.
// local.properties 또는 환경변수로 지정한다. 비워 두면 Firebase Storage 를 쓴다.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def imageBaseUrl = localProperties.getProperty('IMAGE_BASE_URL')
        ?: System.getenv('IMAGE_BASE_URL') ?: ''

android {
    namespace 'com.example.gc_uiactivity'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.gc_uiactivity"
        minSdkVersion 26
        // 동작이 바뀌지 않도록 targetSdk 는 원래 값을 유지한다.
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "IMAGE_BASE_URL", "\"${imageBaseUrl}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Firebase. BoM 이 각 모듈의 버전을 맞춘다.
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-storage'

    // MVVM
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.5.1'
    implementation 'androidx.fragment:fragment:1.5.5'
}
